[project]
name = "wotis"
version = "0.1.0"
description = "The CLI tool for Web of Things Integrated Schemas (WOTIS)"
authors = [
    { name = "Mahda Noura", email = "mahda.noura@siemens.com" }
]
license = "MIT"
readme = "README.md"
include = ["README.md", "resources/schemas/*"]
requires-python = ">=3.14"
dependencies = [
    "linkml @ git+https://github.com/linkml/linkml.git@main#subdirectory=packages/linkml",
    "mkdocs-mermaid2-plugin==1.2.3",
    "mkdocs-material>=9.7.6",
    "schemasheets>=0.1.10",
    "jsonschema>=4.21.1",
    "lxml>=6.1.0",
    "cssselect>=1.4.0",
    "bikeshed>=7.0.11",
    "click>=8.1.7",
    "jsonfold>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-include = ["src/wotis"]

[tool.hatch.metadata]
root = "src"
allow-direct-references = true

[project.scripts]
wotis = "src.wotis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
