id: https://w3c.github.io/wot-thing-description-toolchain/config
name: wot_toolchain_config
title: wot-toolchain config
description: Schema of the config file that a repository passes to wot-toolchain.
prefixes:
  linkml: https://w3id.org/linkml/
  config: https://w3c.github.io/wot-thing-description-toolchain/config/
default_prefix: config
default_range: string
imports:
  - linkml:types

classes:
  Config:
    tree_root: true
    description: The LinkML schemas of one vocabulary and the generators to run on them.
    attributes:
      root_schema:
        description: >-
          Path of the LinkML schema that the generators read together with the schemas it imports.
        required: true
      output_dir:
        description: Directory that receives the generated artifacts.
        required: true
      vocabularies:
        description: The vocabularies that the generators process.
        range: Vocabulary
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      generators:
        description: The generators to run. A generator runs if its key is present.
        range: Generators
        required: true

  Vocabulary:
    description: One LinkML schema and the names of the files generated from it.
    attributes:
      schema:
        description: Path of the LinkML schema.
        required: true
      prefix:
        description: Prefix of the vocabulary, unique among the vocabularies.
        required: true
      diagram:
        description: File name of the class diagram generated from this schema.
        pattern: '^(?!\.\.?$)[^/\\]+$'
      ontology:
        description: File name of the OWL ontology in Turtle generated from this schema.
        pattern: '^(?!\.\.?$)[^/\\]+\.ttl$'

  Generators:
    description: Settings of each generator.
    attributes:
      jsonschema:
        range: JsonSchemaSettings
      jsonldcontext:
        range: JsonLdContextSettings
      shacl:
        range: ShaclSettings
      owl:
        range: OwlSettings
      linkml:
        range: LinkmlSettings
      visualization:
        range: VisualizationSettings
      spec:
        description: Settings of the specification, which is built after the other generators.
        range: SpecSettings

  JsonSchemaSettings:
    attributes:
      top_class:
        description: Class that the root of the JSON Schema describes.
        required: true
      schema:
        description: LinkML schema that the JSON Schema is generated from instead of the root schema.

  JsonLdContextSettings: {}

  ShaclSettings: {}

  OwlSettings:
    attributes:
      metadata_profile:
        description: The annotation property for descriptions.
        range: OwlMetadataProfile
        ifabsent: string(linkml)
      only_root_schema:
        description: >-
          Whether each ontology describes only its own vocabulary, with an owl:imports for each schema it imports.
          Without it, the ontology includes the imported schemas, like gen-owl --mergeimports.
        range: boolean
        ifabsent: "false"
      permissible_values:
        description: The kind of OWL entity for the permissible values of an enum.
        range: OwlPermissibleValueKind
        ifabsent: string(class)

  LinkmlSettings: {}

  VisualizationSettings:
    attributes:
      range_labels:
        description: Text shown as the type of an attribute in the class diagrams for a LinkML range.
        range: RangeLabel
        multivalued: true
        inlined: true

  SpecSettings:
    attributes:
      template:
        description: Path of the HTML template of the specification.
        required: true
      output:
        description: Path of the generated specification.
        required: true
      sections:
        description: Sections of the template that receive the tables of one vocabulary each.
        range: SpecSection
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
      prose:
        description: >-
          Directory of the section prose files. <Class>.html is shown after the vocabulary table of the class and
          <Class>.intro.html before it, in place of the class description.
      snippets:
        description: Directory of the example snippets.
        required: true
      glossary:
        description: Path of the glossary used for cross-references.
        required: true
      extra_asserts:
        description: >-
          Path of an HTML file listing assertions that are tested but are not in the specification.
          They are added to the assertion inventory CSV.
      assertions_csv:
        description: Path of the generated CSV file of assertions.
      default_values_anchor:
        description: Fragment identifier of the template section that the "with default" assignment links to.
      range_labels:
        description: Text shown in the type column of the vocabulary tables for a LinkML range.
        range: RangeLabel
        multivalued: true
        inlined: true

  SpecSection:
    attributes:
      id:
        description: HTML id of the section in the template.
        required: true
      schema:
        description: Path of the vocabulary schema whose tables fill the section.
        required: true

  RangeLabel:
    attributes:
      range:
        description: Name of the LinkML range.
        key: true
      label:
        description: Text shown for the range.
        required: true

enums:
  OwlMetadataProfile:
    permissible_values:
      linkml:
        description: skos:definition, as in the LinkML metamodel and gen-owl.
      rdfs:
        description: rdfs:comment, shown by most OWL tools.

  OwlPermissibleValueKind:
    permissible_values:
      class:
        description: Subclasses of the enum's class, as in gen-owl.
      individual:
        description: Named individuals of the enum's class.
      instance:
        description: Instances of the enum's class only, without owl:NamedIndividual and owl:oneOf.
