# wot-toolchain config of the WoT Thing Description.
# Paths are relative to the directory of this file.

root_schema: resources/schemas/thing_description.yaml
output_dir: resources/gens

vocabularies:
  - schema: resources/schemas/thing_description.yaml
    prefix: td
    diagram: td.svg
  - schema: resources/schemas/hypermedia.yaml
    prefix: hctl
    diagram: hctl.svg
  - schema: resources/schemas/wot_security.yaml
    prefix: wotsec
    diagram: wotsec.svg
  - schema: resources/schemas/jsonschema.yaml
    prefix: jsonschema
    diagram: jsonschema.svg

generators:
  jsonschema:
    top_class: JsonThing
    schema: resources/schemas/profiles/td_jsonschema.yaml
  jsonldcontext:
  shacl:
  owl:
  linkml:
  visualization:
  spec:
    template: resources/index.template.html
    output: resources/gens/index.html
    # The type column of the vocabulary tables names these LinkML ranges as the published TD specification does.
    range_labels:
      Any: any type
      linkml:Any: any type
      langString: rdf:langString
      uri: anyURI
      uriorcurie: anyURI
      datetime: dateTime
      NonNegativeInteger: unsignedInt
      decimal: double
    # The "with default" assignment in the vocabulary tables links to this section of the TD specification template.
    default_values_anchor: sec-default-values
    sections:
      - id: sec-core-vocabulary-definition
        schema: resources/schemas/thing_description.yaml
      - id: sec-data-schema-vocabulary-definition
        schema: resources/schemas/jsonschema.yaml
      - id: sec-security-vocabulary-definition
        schema: resources/schemas/wot_security.yaml
      - id: sec-hypermedia-vocabulary-definition
        schema: resources/schemas/hypermedia.yaml
    # Prose of the class sections: <Class>.html after the vocabulary table, <Class>.intro.html before it.
    prose: resources/spec/sections
    snippets: resources/snippets
    # Thing Description snippets are validated against the generated JSON Schema, Thing Model snippets against this one.
    thing_model_schema: resources/upstream/schemas/tm-json-schema-validation.json
    glossary: resources/xref/glossary.yaml
    # Assertions that are tested but are not in the specification. They are added to assertions_csv.
    extra_asserts: resources/upstream/extra-asserts.html
    assertions_csv: resources/gens/assertions/assertions.csv
