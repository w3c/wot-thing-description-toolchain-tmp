groups:
  coap-binding:
    layout: with-default
    title: MyLampThing with CoAP Protocol Binding
    toggle_label: with Default Values
    compact: coap-binding-compact
    expanded: coap-binding-expanded
  context-expansion:
    layout: with-default
    id: example-context-expansion
    title: TD with htv prefix and context expansion
    toggle_label: with Context Expansion
    compact: context-expansion-compact
    expanded: context-expansion-expanded
  linking-td-to-tm:
    title: Linking Thing Description to a Thing Model Definition
    tabs:
    - snippet: smart-pump-tm
      label: Thing Model
      tab_class: thingmodel
      selected: true
    - snippet: smart-pump-td
      label: Thing Description
      tab_class: thingdescription
  mqtt-binding:
    layout: with-default
    title: MyIlluminanceSensor with MQTT Protocol Binding
    toggle_label: with Default Values
    compact: mqtt-binding-compact
    expanded: mqtt-binding-expanded
  multiple-defaults:
    layout: with-default
    id: example-multiple-defaults-and-expansions
    title: TD with multiple default value and expansion mechanisms
    toggle_label: with Defaults and Expansions
    compact: multiple-defaults-compact
    expanded: multiple-defaults-expanded
  td-default-values:
    layout: with-default
    title: TD with Default Values that can be omitted
    toggle_label: with Default Values
    compact: td-default-values-compact
    expanded: td-default-values-expanded
  td-from-tm:
    title: Thing Description generation from Thing Model
    tabs:
    - snippet: thermostat-placeholder-tm
      label: Thing Model
      tab_class: thingmodel
      selected: true
    - snippet: thermostat-placeholder-map
      label: Placeholder Map
      tab_class: placeholder
    - snippet: thermostat-placeholder-td
      label: Thing Description
      tab_class: thingdescription
  td-smart-ventilator:
    title: Thing Descriptions of the Smart Ventilator
    tabs:
    - snippet: smart-ventilator-td
      label: Top level Smart Ventilator TD
      tab_class: SmartVentilator
      selected: true
    - snippet: ventilation-td
      label: Ventilation TD
      tab_class: Ventilation
    - snippet: led-td
      label: LED TD
      tab_class: LED
  temperature-sensor-event:
    title: Temperature Sensor with a Temperature Event with subscription and cancellation
    tabs:
    - snippet: temp-sensor-event-no-urivars
      label: Without uriVariables
      tab_class: without
      selected: true
    - snippet: temp-sensor-event-urivars
      label: With uriVariables
      tab_class: with
  thing-model-composition:
    title: Top level/parent Smart Ventilator Thing Model
    tabs:
    - snippet: smart-ventilator-tm
      label: Smart Ventilator TM
      tab_class: SmartVentilator
      selected: true
    - snippet: ventilation-tm
      label: Ventilation TM
      tab_class: Ventilation
    - snippet: led-tm
      label: LED TM
      tab_class: LED
