id: https://www.w3.org/2019/wot/security
name: wot_security
title: Security mechanisms for the Web of Things
description: >-
  LinkML schema for the Security vocabulary of the W3C Web of Things (WoT) Thing Description 2.0 model.
version: "2.0"
license: MIT
created_by: mailto:mahda.noura@siemens.com
contributors:
  - mailto:michael.mccool@intel.com
  - https://vcharpenay.link/#me
created_on: "2023-12-05"
last_updated_on: "2026-09-29"
see_also:
  - https://www.w3.org/TR/wot-thing-description11/
  - https://www.w3.org/TR/wot-thing-description11/#sec-security-vocabulary-definition
annotations:
  dcterms:publisher:
    value:
      "@type": schema:Organization
      schema:name: W3C Web of Things Working Group
      schema:url: https://www.w3.org/WoT/WG/

prefixes:
  wotsec: https://www.w3.org/2019/wot/security#
  skos: http://www.w3.org/2004/02/skos/core#
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  td: https://www.w3.org/2019/wot/td#
  dcterms: http://purl.org/dc/terms/
default_prefix: wotsec
imports:
  - linkml:types

enums:
  SecuritySchemeList:
    description: Identification of the security mechanism being configured.
    permissible_values:
      nosec:
        description: No authentication or other security mechanism is required.
      combo:
        description: A combination of named security schemes using oneOf or allOf.
      basic:
        description: HTTP Basic authentication using a username and password.
      digest:
        description: HTTP Digest Access Authentication.
      bearer:
        description: Bearer token authentication independent of OAuth 2.0.
      psk:
        description: Pre-shared key authentication, for example TLS-PSK.
      oauth2:
        description: OAuth 2.0 authentication.
      apikey:
        description: API key authentication using an opaque access token.
      auto:
        description: Security parameters are negotiated by the underlying protocol at runtime.
  SecurityLocationType:
    description: Specifies the location where security authentication information should be provided
    permissible_values:
      header:
        description: The parameter will be given in a header provided by the protocol
      query:
        description: The parameter will be appended to the URI as a query parameter
      body:
        description: The parameter will be provided in the body of the request payload
      cookie:
        description: The parameter is stored in a cookie
      uri:
        description: The parameter is embedded in the URI itself using a URI template variable
      auto:
        description: The location is determined as part of the protocol, or negotiated
  algList:
    description: Examples of encoding, encryption, or digest algorithms for bearer tokens.
    permissible_values:
      ES256:
        description: ECDSA using the P-256 curve and SHA-256.
      ES512-256:
        description: Algorithm identifier listed as an example by TD 1.1.
  QoPType:
    description: Quality of protection options for digest security
    permissible_values:
      auth:
        description: Authentication only
      auth-int:
        description: Authentication with integrity protection
  BearerFormat:
    description: Format specifications for bearer tokens
    permissible_values:
      jwt:
        description: JSON Web Token (RFC7519)
      jws:
        description: JSON Web Signature (RFC7797)
      cwt:
        description: CBOR Web Token (RFC8392)
      jwe:
        description: JSON Web Encryption (RFC7516)
  OAuth2Flow:
    description: OAuth 2.0 authorization flows
    permissible_values:
      code:
        description: Authorization code flow
      client:
        description: Client credentials flow

slots:
  scheme:
    description: Identification of the security mechanism being configured.
    required: true
    range: SecuritySchemeList
  alg:
    description: Encoding, encryption, or digest algorithm (e.g., ES256, ES512-256).
    slot_uri: wotsec:alg
    annotations:
      spec_description: >-
        Encoding, encryption, or digest algorithm.
    range: algList
  flow:
    description: Authorization flow.
    slot_uri: wotsec:flow
    range: OAuth2Flow
  format:
    description: Specifies format of security authentication information.
    slot_uri: wotsec:format
    range: BearerFormat
  identity:
    description: Identifier providing information which can be used for selection or confirmation.
    slot_uri: wotsec:identity
    range: string
  in:
    description: Specifies the location of security authentication information.
    slot_uri: wotsec:in
    annotations:
      skos:note: >-
        The API Key security scheme maps the JSON member `in` to `wotsec:apikeyIn`, while Basic, Digest, and Bearer schemes map it to `wotsec:in`.
    range: SecurityLocationType
    comments:
      - Default value should be provided by implementations
  "@name":
    #this is the name in wot_Security, modelled like this because in LinkML name is a reserved key
    description: >-
      Name for query, header, cookie, or uri parameters. When used with body location, must be a JSON pointer.
    slot_uri: wotsec:name
    annotations:
      spec_description: >-
        Name for query, header, cookie, or uri parameters.
    range: string
  qop:
    description: Quality of protection.
    slot_uri: wotsec:qop
    range: QoPType
    comments:
      - This feature is at risk.
  scopes:
    description: >-
      Set of authorization scope identifiers provided as an array. These are provided in tokens returned by an 
      authorization server and associated with forms in order to identify what resources a client may access and how.
    slot_uri: wotsec:scopes
    annotations:
      spec_description: >-
        Set of authorization scope identifiers provided as an array. 
        These are provided in tokens returned by an authorization server and associated with forms in order to identify what resources 
        a client may access and how. The values associated with a form SHOULD be chosen from those defined in an `OAuth2SecurityScheme` active on that form.
    any_of:
      - range: string
      - range: string
        multivalued: true
    comments:
      - This feature is at risk.
  proxy:
    description: >-
      URI of the proxy server this security configuration provides access to. If not given, the corresponding 
      security configuration is for the endpoint.
    slot_uri: wotsec:proxy
    range: uri
    comments:
      - This feature is at risk.
  authorization:
    description: URI of the authorization server.
    slot_uri: wotsec:authorization
    range: uri
  refresh:
    description: URI of the refresh server.
    slot_uri: wotsec:refresh
    range: uri
  token:
    description: URI of the token server.
    slot_uri: wotsec:token
    range: uri
  security_oneOf:
    description: >-
      Array of two or more strings identifying other named security scheme definitions, any one of which, when satisfied, will allow access. Only one may be chosen for use.
    alias: oneOf
    slot_uri: wotsec:oneOf
    annotations:
      skos:note: >-
        In a Combo security scheme, `oneOf` maps to `wotsec:oneOf` rather than the distinct `jsonschema:oneOf` term.
    range: string
    multivalued: true
    minimum_value: 2
  security_allOf:
    description: >-
      Array of two or more strings identifying other named security scheme definitions, all of which must be
      satisfied for access.
    alias: allOf
    slot_uri: wotsec:allOf
    range: string
    multivalued: true
    minimum_value: 2
classes:
  SecurityScheme:
    description: >-
      Metadata describing the configuration of a security mechanism. The value assigned to the name scheme MUST be defined 
      within a Vocabulary included in the Thing Description. For all security schemes, any keys, passwords, or other 
      sensitive information directly providing access MUST NOT be stored in the TD and should instead be shared and 
      stored out-of-band via other mechanisms.
    class_uri: wotsec:SecurityScheme
    annotations:
      jsonschema_oneof_dispatch:
        value:
          discriminator: scheme
          include_unknown: true
      spec_intro_content:
        value:
          - type: paragraph
            segments:
              - text: |
                  Metadata describing the configuration of a security mechanism.
              - id: td-security-scheme-name
                text: |
                  The value assigned to the name `scheme` MUST be defined within a Vocabulary included in the Thing Description, either in the standard Vocabulary defined in [TD Information Model](#sec-vocabulary-definition) or in a [TD Context Extension](#sec-vocabulary-definition).
          - type: paragraph
            segments:
              - id: td-security-no-secrets
                text: |
                  For all security schemes, any keys, passwords, or other sensitive information directly providing access *MUST NOT* be stored in the TD and should instead be shared and stored out-of-band via other mechanisms.
              - text: |
                  The purpose of a TD is to describe how to access a Thing if and only if a Consumer already has authorization, and is not meant be used to grant that authorization.
          - type: markdown
            text: |
              Each security scheme object used in a TD defines a set of requirements to be met before access can be granted. We say a security scheme is *satisfied* when all its requirements are met. In some cases requirements from multiple security schemes will have to be met before access can be granted.

              Security schemes generally may require additional authentication parameters, such as a password or key. The location of this information is indicated by the value associated with the name `in`, often in combination with the value associated with `name`. The value associated with `in` can take one of the following values:

              **header**:
              The parameter will be given in a header provided by the protocol, with the name of the header provided by the value of name.

              **query**:
              The parameter will be appended to the URI as a query parameter, with the name of the query parameter provided by name.
          - type: paragraph
            segments:
              - text: |
                  **body**: The parameter will be provided in the body of the request payload, with the data schema element used provided by *name*.
              - id: td-security-body-name-json-pointer
                text: |
                  When used in the context of a *body* security information location, the value of name *MUST* be in the form of a JSON pointer [[!RFC6901]] relative to the root of the input `DataSchema` for each interaction it is used with.
              - text: |
                  Since this value is not a fragment identifier, and is not relative to the root of the TD but to whichever data schemas the security scheme is bound to, this value should not start with #; it is a "pure" JSON pointer. Since this value is not a fragment identifier, it also does not need to URL-encode special characters. The targeted element may or may not already exist at the specified location in the referenced object or array schema (consequently the mechanism is not applicable to simple types). If it does not, it will be inserted. This avoids having to duplicate definitions in the data schemas of every interaction.
              - id: td-security-body-name-json-pointer-creatable
                text: |
                  When an element of a data schema indicated by a JSON pointer indicated in a body locator does not already exist in the indicated schema, it *MUST* be possible to insert the indicated element at the location indicated by the pointer.
              - id: td-security-body-name-json-pointer-array
                text: |
                  The JSON pointer used in the body locator *MAY* use the "-" character to indicate a non-existent array element when it is necessary to insert an element after the last element of an existing array.
              - id: td-security-body-name-json-pointer-type
                text: |
                  The element referenced (or created) by a `body` security information location *MUST* be required and of type "string".
              - text: |
                  If name is not given, it is assumed the entire body is to be used as the security parameter.
          - type: markdown
            text: |
              **cookie**:
              The parameter is stored in a cookie identified by the value of name.
          - type: paragraph
            segments:
              - text: |
                  **uri**: The parameter is embedded in the URI itself, which is encoded in the relevant interaction using a URI template variable defined by the value of name. This is more general than the query mechanism but more complex.
              - id: td-security-in-query-over-uri
                text: |
                  The value uri *SHOULD* be specified for the name in in a security scheme only if query is not applicable.
              - id: td-security-in-uri-variable
                text: |
                  The URIs provided in interactions where a security scheme using uri as the value for in *MUST* be a URI template including the defined variable.
          - type: paragraph
            segments:
              - text: |
                  **auto**: The location is determined as part of the protocol, or negotiated.
              - id: td-security-security-vocab-auto-in-no-name
                text: |
                  If a value of `auto` is set for the `in` field of a `SecurityScheme`, then the name field *SHOULD NOT* be set.
              - text: |
                  In this case, the application of the `SecurityScheme` is subject to the respective specification for the given protocol (e.g. [[RFC7617]] when using the `BasicSecurityScheme` with HTTP).
          - type: markdown
            text: |
              If multiple parameters are needed for a security scheme, repeat the security scheme definition for each parameter and combine them using a combo security scheme and `allOf`. In some cases parameters may not actually be secret but a user may wish to leave them out of the TD to help protect privacy. As an example of this, some security mechanisms require both a client identifier and a secret key. In theory, the client identifier is public however it may be hard to update and pose a tracking risk. In such a case it can be provided as an additional security parameter so it does not appear in the TD.
          - type: assertion
            id: td-security-uri-variables-distinct
            text: |
              The names of URI variables declared in a `SecurityScheme` *MUST* be distinct from all other URI variables declared in the TD.
      spec_content:
        value:
          - type: markdown
            text: |
              The !class SecurityScheme has the following subclasses:

              - NoSecurityScheme
              - AutoSecurityScheme
              - ComboSecurityScheme
              - BasicSecurityScheme
              - DigestSecurityScheme
              - APIKeySecurityScheme
              - BearerSecurityScheme
              - PSKSecurityScheme
              - OAuth2SecurityScheme
    extra_slots:
      allowed: true
    attributes:
      name:
        identifier: true
        range: string
        description: Name of the security scheme definition.
        annotations:
          spec_exclude: true
    slots:
      - "@type"
      - description
      - descriptions
      - proxy
      - scheme
    slot_usage:
      "@type":
        range: string
        exactly_one_of:
          - range: string
          - range: string
            multivalued: true
            minimum_cardinality: 1
  NoSecurityScheme:
    description: >-
      A security configuration indicating there is no authentication or other mechanism required to access the resource.
    class_uri: wotsec:NoSecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_description: >-
        A security configuration identified by the Vocabulary Term `nosec` (i.e., "scheme": "nosec"), indicating there is no authentication or other mechanism required to access the resource.
    extra_slots:
      allowed: true
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - nosec
  AutoSecurityScheme:
    description: >-
      An automatic authentication security configuration identified by the term auto. This scheme indicates that the security 
      parameters are going to be negotiated by the underlying protocols at runtime.
    class_uri: wotsec:AutoSecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_description: >-
        An automatic authentication security configuration identified by the term `auto` (i.e., "scheme": "auto"). This scheme indicates that the security parameters are going to be negotiated by the underlying protocols at runtime, subject to the respective specifications for the protocol (e.g. [[RFC7617]] for Basic Authentication when using HTTP).
    extra_slots:
      allowed: true
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - auto
  ComboSecurityScheme:
    description: >-
      A combination of other security schemes. Exactly one of either oneOf or allOf vocabulary terms MUST be included.
    class_uri: wotsec:ComboSecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_intro_content:
        value:
          - type: paragraph
            segments:
              - text: |
                  A combination of other security schemes identified by the Vocabulary Term `combo` (i.e., "scheme": "combo"). Elements of this scheme define various ways in which other named schemes defined in `securityDefinitions`, including other ComboSecurityScheme definitions, are to be combined to create a new scheme definition.
              - id: td-security-combo-exclusive-oneof-or-allof
                text: |
                  Exactly one of either `oneOf` or `allOf` vocabulary terms *MUST* be included.
              - text: |
                  Only security scheme definitions which can be used together can be combined with `allOf`. For example, it is not possible in general to combine different OAuth 2.0 flows together using `allOf` unless one applies to a proxy and one to the endpoint. Note that when multiple named security scheme definitions are listed in a `security` field the same semantics apply as in an `allOf` combination (and the same limitations on allowable combinations). The `oneOf` combination is equivalent to using different security schemes on forms that are otherwise identical. In this sense a `oneOf` scheme is not an essential feature but it does avoid redundancy in such cases.
    extra_slots:
      allowed: true
    slots:
      - security_oneOf
      - security_allOf
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - combo
  BasicSecurityScheme:
    description: >-
      Basic Authentication security configuration using an unencrypted username and password.
    class_uri: wotsec:BasicSecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_description: >-
        Basic Authentication [[RFC7617]] security configuration identified by the Vocabulary Term `basic` (i.e., "scheme": "basic"), using an unencrypted username and password.
    extra_slots:
      allowed: true
    slots:
      - "@name"
      - in
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - basic
      in:
        annotations:
          spec_default: true
          spec_type_values:
            value:
              mode: one_of
              values:
                - header
                - query
                - body
                - cookie
                - auto
  DigestSecurityScheme:
    description: >-
      Digest Access Authentication security configuration. This scheme is similar to basic authentication but with 
      added features to avoid man-in-the-middle attacks.
    class_uri: wotsec:DigestSecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_description: >-
        Digest Access Authentication [[RFC7616]] security configuration identified by the Vocabulary Term `digest` (i.e., "scheme": "digest").
        This scheme is similar to basic authentication but with added features to avoid man-in-the-middle attacks.
    extra_slots:
      allowed: true
    slots:
      - "@name"
      - in
      - qop
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - digest
      in:
        annotations:
          spec_default: true
          spec_type_values:
            value:
              mode: one_of
              values:
                - header
                - query
                - body
                - cookie
                - auto
      qop:
        annotations:
          spec_default: true
          spec_type_values:
            value:
              mode: one_of
              values:
                - auth
                - auth-int
  APIKeySecurityScheme:
    description: >-
      API key authentication security configuration identified by the term apikey. This scheme is to be used when the 
      access token is opaque, for example when a key in an unknown or proprietary format is provided by a cloud service provider.
    class_uri: wotsec:APIKeySecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_description: >-
        API key authentication security configuration identified by the Vocabulary Term `apikey` (i.e., "scheme": "apikey"). 
        This scheme is to be used when the access token is opaque, for example when a key in an unknown or proprietary format is provided by a cloud service provider. 
        In this case the key may not be using a standard token format. 
        This scheme indicates that the key provided by the service provider needs to be supplied as part of service requests using the mechanism indicated by the `in` field.
    extra_slots:
      allowed: true
    slots:
      - "@name"
      - in
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - apikey
      in:
        slot_uri: wotsec:apikeyIn
        required: true
        range: SecurityLocationType
        annotations:
          spec_default: true
          spec_type_values:
            value:
              mode: one_of
              values:
                - header
                - query
                - body
                - cookie
                - uri
                - auto
  BearerSecurityScheme:
    description: >-
      Bearer Token security configuration for situations where bearer tokens are used independently of OAuth2.
    class_uri: wotsec:BearerSecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_intro_content:
        value:
          - type: paragraph
            segments:
              - text: |
                  Bearer Token [[RFC6750]] security configuration identified by the Vocabulary Term `bearer` (i.e., "scheme": "bearer") for situations where bearer tokens are used independently of OAuth2. If the `oauth2` scheme is specified it is not generally necessary to specify this scheme as well as it is implied. For `format`, the value `jwt` indicates conformance with [[RFC7519]], `jws` indicates conformance with [[RFC7797]], `cwt` indicates conformance with [[RFC8392]], and `jwe` indicates conformance with [[RFC7516]], with values for `alg` interpreted consistently with those standards.
              - id: td-security-bearer-format-extensions
                text: |
                  Other formats and algorithms for bearer tokens *MAY* be specified in vocabulary extensions.
    extra_slots:
      allowed: true
    slots:
      - authorization
      - "@name"
      - in
      - alg
      - format
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - bearer
      in:
        annotations:
          spec_default: true
          spec_type_values:
            value:
              mode: one_of
              values:
                - header
                - query
                - body
                - cookie
                - auto
      alg:
        annotations:
          spec_default: true
          spec_type_values:
            value:
              mode: examples
              values:
                - ES256
                - ES512-256
      format:
        annotations:
          spec_default: true
          spec_type_values:
            value:
              mode: examples
              values:
                - jwt
                - cwt
                - jwe
                - jws
  PSKSecurityScheme:
    description: >-
      Pre-shared key authentication security configuration. This is meant to identify that a standard is used for 
      pre-shared keys such as TLS-PSK.
    class_uri: wotsec:PSKSecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_description: >-
        Pre-shared key authentication security configuration identified by the Vocabulary Term `psk` (i.e., "scheme": "psk"). 
        This is meant to identify that a standard is used for pre-shared keys such as TLS-PSK [[RFC4279]], 
        and that the ciphersuite used for keys will be established during protocol negotiation.
    extra_slots:
      allowed: true
    slots:
      - identity
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - psk
  OAuth2SecurityScheme:
    description: >-
      OAuth 2.0 authentication security configuration for systems conformant with RFC6749 and RFC8252.
    class_uri: wotsec:OAuth2SecurityScheme
    is_a: SecurityScheme
    annotations:
      spec_description: >-
        OAuth 2.0 authentication security configuration for systems conformant with [[RFC6749]] and [[RFC8252]], 
        identified by the Vocabulary Term `oauth2` (i.e., "scheme": "oauth2").
      spec_content:
        value:
          - type: paragraph
            segments:
              - id: td-security-oauth2-code-flow
                text: |
                  For the code flow, both `authorization` and token vocabulary terms *MUST* be included.
              - id: td-security-oauth2-client-flow
                text: |
                  For the `client` flow, token vocabulary term *MUST* be included.
              - id: td-security-oauth2-client-flow-no-auth
                text: |
                  For the `client` flow, `authorization` vocabulary term *MUST NOT* be included.
              - text: |
                  The mandatory elements for each flow are summarized in the following table:
    extra_slots:
      allowed: true
    slots:
      - authorization
      - token
      - refresh
      - scopes
      - flow
    slot_usage:
      scheme:
        range: string
        equals_string_in:
          - oauth2
      scopes:
        exactly_one_of:
          - range: string
          - range: string
            multivalued: true
      flow:
        required: true