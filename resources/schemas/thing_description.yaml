id: https://www.w3.org/2019/wot/td
name: thing_description
title: Thing Description
description: >-
  Vocabulary to describe the metadata and interfaces of Things in the W3C Web of Things.
version: "td-next"
license: http://purl.org/NET/rdflicense/cc-by4.0
created_by: mailto:mahda.noura@siemens.com
created_on: "2023-12-05T00:00:00Z"
last_updated_on: "2026-10-16T00:00:00Z"
see_also:
  - https://www.w3.org/TR/wot-thing-description11/
annotations:
  dcterms:publisher:
    value:
      "@type": schema:Organization
      schema:name: W3C Web of Things Working Group
      schema:url: https://www.w3.org/WoT/WG/
  owl:priorVersion: https://www.w3.org/2022/wot/td/v1.1

prefixes:
  linkml: https://w3id.org/linkml/
  td: https://www.w3.org/2019/wot/td#
  owl: http://www.w3.org/2002/07/owl#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xml: http://www.w3.org/XML/1998/namespace
  xsd: http://www.w3.org/2001/XMLSchema#
  foaf: http://xmlns.com/foaf/0.1/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  vann: http://purl.org/vocab/vann/
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  hctl: https://www.w3.org/2019/wot/hypermedia#
  wotsec: https://www.w3.org/2019/wot/security#
  jsonschema: https://www.w3.org/2019/wot/json-schema#
  tm: https://www.w3.org/2019/wot/tm#
default_range: string
default_prefix: td
imports:
  - linkml:types
  - hypermedia
  - wot_security
  - jsonschema

types:
  number:
    description: >-
      A number can be an integer or a decimal number
    uri: xsd:decimal
    base: decimal
  literal:
    typeof: string
    description: >-
      An RDF literal that may be a plain xsd:string or a language-tagged
      rdf:langString, depending on the active @language in the JSON-LD
      context of the TD instance.
    uri: rdf:PlainLiteral
  langString:
    description: >-
      A language-tagged RDF string.
    uri: rdf:langString
    base: str
  bcp47_string:
    description: A string conforming to the BCP 47 language tag syntax.
    uri: xsd:string
    base: str
    pattern: "^(((([A-Za-z]{2,3}(-([A-Za-z]{3}(-[A-Za-z]{3}){0,2}))?)|[A-Za-z]{4}|[A-Za-z]{5,8})(-([A-Za-z]{4}))?(-([A-Za-z]{2}|[0-9]{3}))?(-([A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(-([0-9A-WY-Za-wy-z](-[A-Za-z0-9]{2,8})+))*(-(x(-[A-Za-z0-9]{1,8})+))?)|(x(-[A-Za-z0-9]{1,8})+)|((en-GB-oed|i-ami|i-bnn|i-default|i-enochian|i-hak|i-klingon|i-lux|i-mingo|i-navajo|i-pwn|i-tao|i-tay|i-tsu|sgn-BE-FR|sgn-BE-NL|sgn-CH-DE)|(art-lojban|cel-gaulish|no-bok|no-nyn|zh-guoyu|zh-hakka|zh-min|zh-min-nan|zh-xiang)))$"

enums:
  ThingContextUri:
    description: Valid W3C WoT Thing Description context URIs.
    enum_uri: linkml:uri
    permissible_values:
      "https://www.w3.org/ns/wot-next/td":
        description: WoT Thing Description td-next JSON-LD context URI.

slots:
  atContext:
    alias: "@context"
    description: JSON-LD keyword to define short-hand names called terms that are used throughout a TD document.
    required: true
    exactly_one_of:
      - range: ThingContextUri
      - multivalued: true
        minimum_cardinality: 1
        any_of:
          - range: uri
          - range: Any
        has_member:
          equals_string: "https://www.w3.org/ns/wot-next/td"
  atType:
    alias: "@type"
    description: JSON-LD keyword to label the object with semantic tags (or types).
    annotations:
      spec_description: JSON-LD keyword to label the object with [=semantic tags=] (or types).
    range: string
    exactly_one_of:
      - range: string
        none_of:
          - equals_string: "tm:ThingModel"
      - range: string
        multivalued: true
        minimum_cardinality: 1
        none_of:
          - equals_string: "tm:ThingModel"
  id:
    description: >-
      Identifier of the Thing in form of a URI RFC3986 (e.g., stable URI, temporary and mutable URI,
      URI with local IP address, URN, etc.).
    annotations:
      spec_description: >-
        Identifier of the Thing in form of a URI [[RFC3986]] (e.g., stable URI, temporary and mutable URI,
        URI with local IP address, URN, etc.).
    range: uri
  version:
    description: >-
      Provides version information.
    slot_uri: td:hasVersionInfo
    domain: Thing
    implements:
      - owl:ObjectProperty
    range: VersionInfo
    inlined: true
    see_also:
      - schema:version
  created:
    description: >-
      Provides information when the TD instance was created.
    slot_uri: dcterms:created
    implements:
      - owl:AnnotationProperty
    range: datetime
  modified:
    description: >-
      Provides information when the TD instance was last modified.
    slot_uri: dcterms:modified
    implements:
      - owl:AnnotationProperty
    range: datetime
  support:
    description: >-
      Provides information about the TD maintainer as URI scheme (e.g., mailto [[RFC6068]], tel [[RFC3966]], https [[RFC9112]]).
    slot_uri: td:supportContact
    domain: Thing
    implements:
      - owl:AnnotationProperty
    annotations:
      spec_description: >-
        Provides information about the TD maintainer as URI scheme
        (e.g., `mailto` [[RFC6068]], `tel` [[RFC3966]], `https` [[RFC9112]]).
    see_also:
      - schema:contactPoint
    range: uri
  base:
    description: >-
      Define the base URI that is used for all relative URI references throughout a TD document.
      In TD instances, all relative URIs are resolved relative to the base URI using the algorithm defined in [RFC3986].
      base does not affect the URIs used in @context and the IRIs used within Linked Data graphs that are relevant when semantic processing is applied to TD instances.
    slot_uri: td:baseURI
    domain: Thing
    annotations:
      spec_description: >-
        Define the absolute base URI that is used for all relative URI references throughout a TD document.
        In TD instances, all relative URIs are resolved relative to the base URI using the algorithm
        defined in [[RFC3986]].

        `base` does not affect the URIs used in `@context` and the IRIs used within Linked Data
        [[LINKED-DATA]] graphs that are relevant when semantic processing is applied to TD instances.

        Also see [the note](#note-uri-iri) about the type of base URI.
    range: uri
  # -- OWL-only properties ------------------------------------------------
  # These slots exist to emit OWL ObjectProperties that appear in
  # the ontology but have no key in compacted JSON-LD. They serve as
  # parent properties (via is_a) or as ontology concepts
  # referenced only in JSON-LD index mappings.
  hasInteractionAffordance:
    description: >-
      Offers an affordance to interact with the Thing.
    slot_uri: td:hasInteractionAffordance
    domain: Thing
    implements:
      - owl:ObjectProperty
    range: InteractionAffordance
  hasInstanceConfiguration:
    description: >-
      Instantiation, as used here, is a form of non-symmetric equivalence
      between a scheme and a configuration: whatever statement on the scheme
      is also true of the configuration but not vice-versa.
    slot_uri: td:hasInstanceConfiguration
    domain: SecurityScheme
    implements:
      - owl:ObjectProperty
  # -- end OWL-only properties --------------------------------------------
  properties:
    description: >-
      All Property-based Interaction Affordances of the Thing.
    slot_uri: td:hasPropertyAffordance
    domain: Thing
    is_a: hasInteractionAffordance
    annotations:
      jsonld_index: td:name
    range: PropertyAffordance
    multivalued: true
    inlined: true
  actions:
    description: >-
      All Action-based Interaction Affordances of the Thing.
    slot_uri: td:hasActionAffordance
    domain: Thing
    is_a: hasInteractionAffordance
    annotations:
      jsonld_index: td:name
    range: ActionAffordance
    multivalued: true
    inlined: true
  events:
    description: >-
      All Event-based Interaction Affordances of the Thing.
    slot_uri: td:hasEventAffordance
    domain: Thing
    is_a: hasInteractionAffordance
    annotations:
      jsonld_index: td:name
    range: EventAffordance
    multivalued: true
    inlined: true
  links:
    description: >-
      Provides Web links to arbitrary resources that relate to the specified Thing Description.
    slot_uri: td:hasLink
    domain: Thing
    range: Link
    multivalued: true
  forms:
    description: >-
      Set of form hypermedia controls that describe how an operation can be performed.
      Forms are serializations of Protocol Bindings.
      The array cannot be empty.
    slot_uri: td:hasForm
    annotations:
      spec_description: >-
        Set of form hypermedia controls that describe how an operation can be performed.
        Forms are serializations of Protocol Bindings.
        [Thing level](#dfn-td-thing-level) forms are used to describe endpoints for a group of interaction affordances.
    range: Form
    multivalued: true
  security:
    description: >-
      A security configuration is a security scheme applied to a (set of) affordance(s).
    slot_uri: td:hasSecurityConfiguration
    range: SecurityScheme
    annotations:
      spec_description: >-
        Set of security definition names, chosen from those defined in `securityDefinitions`.
        These must all be satisfied for access to resources.
  securityDefinitions:
    description: >-
      A Thing may define abstract security schemes, used to configure the secure access of (a set of) affordance(s).
    slot_uri: td:definesSecurityScheme
    domain: Thing
    annotations:
      jsonld_container: "@id"
      spec_description: >-
        Set of named security configurations (definitions only).
        Not actually applied unless names are used in a `security` name-value pair.
    range: SecurityScheme
    multivalued: true
    inlined: true
    required: true
    minimum_cardinality: 1
  profile:
    description: >-
      Indicates the WoT Profile mechanisms followed by this Thing Description and the corresponding Thing implementation.
    slot_uri: td:followsProfile
    domain: Thing
    range: uri
    exactly_one_of:
      - range: uri
      - range: uri
        multivalued: true
        minimum_cardinality: 1
  schemaDefinitions:
    description: >-
      Set of named data schemas. To be used in a schema name-value pair inside an AdditionalExpectedResponse object.
    slot_uri: td:schemaDefinitions
    domain: Thing
    annotations:
      jsonld_context: none
      jsonld_container: "@id"
      spec_description: >-
        Set of named data schemas. To be used in a schema name-value pair inside an `AdditionalExpectedResponse` object.
    range: DataSchema
    multivalued: true
    inlined: true
  uriVariables:
    description: >-
      Define URI template variables according to RFC6570 as collection based on schema specifications.
      The individual variables DataSchema cannot be an ObjectSchema or an ArraySchema.
    slot_uri: td:hasUriTemplateSchema
    annotations:
      jsonld_index: td:name
      spec_description: >-
        Define URI template variables according to [[RFC6570]] as collection based on DataSchema declarations.
        The [=Thing level=] `uriVariables` can be used in [=Thing level=] forms or in Interaction Affordances.
        The individual variables DataSchema cannot be an ObjectSchema or an ArraySchema since each variable
        needs to be serialized to a string inside the `href` upon the execution of the operation.
        If the same variable is both declared in [=Thing level=] `uriVariables` and in Interaction Affordance
        level, the Interaction Affordance level variable takes precedence.
    range: DataSchema
    multivalued: true
    inlined: true
  title:
    description: >-
      Title of the TD element (Thing, interaction affordance or data schema).
    slot_uri: td:title
    annotations:
      spec_description: >-
        Provides a human-readable title (e.g., display a text for UI representation) based on a default language.
    range: literal
    exactly_one_of:
      - range: string
      - range: langString
  titles:
    description: >-
      Title of the TD element (Thing, interaction affordance or data schema) with language tag.
      By convention, a language tag must be added to the object of 'titleInLanguage' triples. Otherwise, use 'title'.
    slot_uri: td:titleInLanguage
    annotations:
      spec_description: >-
        Provides multi-language human-readable titles (e.g., display a text for UI representation in different languages).
        Also see [=MultiLanguage=].
      jsonld_container: "@language"
    inlined: true
    multivalued: true
    range: MultiLanguage
  description:
    description: >-
      Description of the TD element (Thing, interaction affordance, security scheme or data schema).
    slot_uri: td:description
    annotations:
      spec_description: >-
        Provides additional (human-readable) information based on a default language.
      rdfs:subPropertyOf: dcterms:description
    range: literal
    exactly_one_of:
      - range: string
      - range: langString
  descriptions:
    description: >-
      Description of the TD element (Thing, interaction affordance, security scheme or data schema) with language tag.
      By convention, a language tag must be added to the object of 'descriptionInLanguage' triples. Otherwise, use 'description'.
    slot_uri: td:descriptionInLanguage
    annotations:
      spec_description: >-
        Can be used to support (human-readable) information in different languages.
        Also see [=MultiLanguage=].
      rdfs:subPropertyOf: dcterms:description
      jsonld_container: "@language"
    inlined: true
    multivalued: true
    range: MultiLanguage

classes:
  Thing:
    description: >-
      An abstraction of a physical or a virtual entity whose metadata and interfaces are described by a WoT Thing
      Description, whereas a virtual entity is the composition of one or more Things.
    class_uri: td:Thing
    tree_root: true
    extra_slots:
      allowed: true
    slots:
      - atContext
      - atType
      - id
      - title
      - titles
      - description
      - descriptions
      - version
      - created
      - modified
      - support
      - base
      - properties
      - actions
      - events
      - links
      - forms
      - security
      - securityDefinitions
      - profile
      - schemaDefinitions
      - uriVariables
    slot_usage:
      atContext:
        required: true
      atType:
        range: string
        exactly_one_of:
          - range: string
            none_of:
              - equals_string: "tm:ThingModel"
          - range: string
            multivalued: true
            minimum_cardinality: 1
            none_of:
              - equals_string: "tm:ThingModel"
      security:
        required: true
        exactly_one_of:
          - range: SecurityScheme
          - range: SecurityScheme
            multivalued: true
            minimum_cardinality: 1
      profile:
        exactly_one_of:
          - range: uri
          - range: uri
            multivalued: true
            minimum_cardinality: 1
      title:
        required: true
        exactly_one_of:
          - range: string
          - range: langString
      securityDefinitions:
        range: SecurityScheme
        multivalued: true
        required: true
        minimum_cardinality: 1
      properties:
        slot_uri: td:hasPropertyAffordance
        description: >-
          All Property-based Interaction Affordances of the Thing.
        annotations:
          spec_description: >-
            All Property-based [=Interaction Affordances=] of the Thing.
        range: PropertyAffordance
      actions:
        description: >-
          All Action-based Interaction Affordances of the Thing.
        annotations:
          spec_description: >-
            All Action-based [=Interaction Affordances=] of the Thing.
        range: ActionAffordance
        multivalued: true
        inlined: true
      events:
        description: >-
          All Event-based Interaction Affordances of the Thing.
        annotations:
          spec_description: >-
            All Event-based [=Interaction Affordances=] of the Thing.
        range: EventAffordance
        multivalued: true
        inlined: true
      forms:
        annotations:
          jsonschema_form_subset:
            value: root_ops
  InteractionAffordance:
    description: >-
      Metadata of a Thing that shows the possible choices to Consumers, thereby suggesting how Consumers may interact with the Thing.
      There are many types of potential affordances, but W3C WoT defines three types of Interaction Affordances: Properties, Actions, and Events.
    class_uri: td:InteractionAffordance
    extra_slots:
      allowed: true
    abstract: true
    attributes:
      name:
        identifier: true
        description: >-
          Indexing property to store entity names when serializing them in a JSON-LD @index container.
        slot_uri: td:name
        domain: InteractionAffordance
        range: string
        annotations:
          spec_exclude: true
          spec_description: >-
            Name of the interaction affordance.
    slots:
      - atType
      - title
      - titles
      - description
      - descriptions
      - forms
      - uriVariables
    slot_usage:
      atType:
        range: string
        exactly_one_of:
          - range: string
            none_of:
              - equals_string: "tm:ThingModel"
          - range: string
            multivalued: true
            minimum_cardinality: 1
            none_of:
              - equals_string: "tm:ThingModel"
      forms:
        range: Form
        multivalued: true
        required: true
        minimum_cardinality: 1
        annotations:
          spec_description: >-
            Set of form hypermedia controls that describe how an operation can be performed. Forms are serializations of Protocol Bindings. The array cannot be empty.
      uriVariables:
        description: >-
          Define URI template variables according to RFC6570 as collection based on DataSchema declarations. The individual variables DataSchema cannot be an ObjectSchema or an ArraySchema since each variable needs to be serialized to a string inside the href upon the execution of the operation. If the same variable is both declared in Thing level uriVariables and in Interaction Affordance level, the Interaction Affordance level variable takes precedence.
        annotations:
          spec_description: >-
            Define URI template variables according to [[RFC6570]] as collection based on DataSchema declarations. The individual variables DataSchema cannot be an ObjectSchema or an ArraySchema since each variable needs to be serialized to a string inside the `href` upon the execution of the operation. If the same variable is both declared in [=Thing level=] `uriVariables` and in Interaction Affordance level, the Interaction Affordance level variable takes precedence.
  PropertyAffordance:
    description: >-
      An Interaction Affordance that exposes state of the Thing.
      This state can be retrieved (read) and/or updated (write).
      Things can also choose to make Properties observable by pushing the new state after a change.
    class_uri: td:PropertyAffordance
    is_a: InteractionAffordance
    mixins:
      - DataSchema
    slot_usage:
      forms:
        annotations:
          jsonschema_form_subset:
            value: property_ops
    extra_slots:
      allowed: true
    attributes:
      observable:
        description: >-
          A hint that indicates whether Servients hosting the Thing and Intermediaries should provide a Protocol Binding
          that supports the observeproperty and unobserveproperty operations for this Property.
        annotations:
          spec_default: true
          spec_description: >-
            A hint that indicates whether Servients hosting the Thing and Intermediaries should provide a Protocol Binding that supports the `observeproperty` and `unobserveproperty` operations for this Property. Also see [[[#interaction-semantics]]] for further information on the usage patterns and implications.
        slot_uri: td:isObservable
        domain: PropertyAffordance
        range: boolean
  ActionAffordance:
    description: >-
      An Interaction Affordance that allows to invoke a function of the Thing,
      which manipulates state (e.g., toggling a lamp on or off) or triggers a process on the Thing (e.g., dim a lamp over time).
    class_uri: td:ActionAffordance
    is_a: InteractionAffordance
    slot_usage:
      forms:
        annotations:
          jsonschema_form_subset:
            value: action_ops
    extra_slots:
      allowed: true
    attributes:
      input:
        description: >-
          Used to define the input data schema of the action.
        slot_uri: td:hasInputSchema
        domain: ActionAffordance
        range: DataSchema
        inlined: true
        annotations:
          spec_description: >-
            Used to define the input data schema of the Action.
      output:
        description: >-
          Used to define the output data schema of the action.
        slot_uri: td:hasOutputSchema
        domain: ActionAffordance
        range: DataSchema
        inlined: true
        annotations:
          spec_description: >-
            Used to define the output data schema of the Action.
      safe:
        description: >-
          Signals if the action is safe (=true) or not.
          Used to signal if there is no internal state (cf. resource state) is changed when invoking an Action.
          In that case responses can be cached as example.
        annotations:
          spec_default: true
          spec_description: >-
            Signals if the Action is safe (=true) or not.
            Used to signal if there is no internal state (cf. resource state) is changed when invoking an Action.
            In that case responses can be cached as example.
        slot_uri: td:isSafe
        domain: ActionAffordance
        range: boolean
      idempotent:
        description: >-
          Indicates whether the action is idempotent (=true) or not.
          Informs whether the action can be called repeatedly with the same result, if present, based on the same input.
        annotations:
          spec_default: true
          spec_description: >-
            Indicates whether the Action is idempotent (=true) or not.
            Informs whether the Action can be called repeatedly with the same result, if present, based on the same input.
        slot_uri: td:isIdempotent
        domain: ActionAffordance
        range: boolean
      synchronous:
        description: >-
          Indicates whether the action is synchronous (=true) or not.
          A synchronous action means that the response of action contains all the information about the result of the action
          and no further querying about the status of the action is needed.
        annotations:
          spec_description: >-
            Indicates whether the action is synchronous (=true) or not.
            A synchronous action means that the response of action contains all the information about the result of the action
            and no further querying about the status of the action is needed.
            Lack of this keyword means that no claim on the synchronicity of the action can be made.
        slot_uri: td:isSynchronous
        domain: ActionAffordance
        range: boolean
  EventAffordance:
    description: >-
      An Interaction Affordance that describes an event source,
      which asynchronously pushes event data to Consumers (e.g., overheating alerts).
    class_uri: td:EventAffordance
    is_a: InteractionAffordance
    slot_usage:
      forms:
        annotations:
          jsonschema_form_subset:
            value: event_ops
    extra_slots:
      allowed: true
    attributes:
      subscription:
        description: >-
          Defines data that needs to be passed upon subscription, e.g., filters or message format for setting up Webhooks.
        slot_uri: td:hasSubscriptionSchema
        domain: EventAffordance
        range: DataSchema
        inlined: true
      data:
        description: >-
          Defines the data schema of the Event instance messages pushed by the Thing.
        slot_uri: td:hasNotificationSchema
        domain: EventAffordance
        range: DataSchema
        inlined: true
      dataResponse:
        description: >-
          Defines the data schema of the Event response messages sent by the consumer in a response to a data message.
        slot_uri: td:hasNotificationResponseSchema
        domain: EventAffordance
        range: DataSchema
        inlined: true
      cancellation:
        description: >-
          Defines any data that needs to be passed to cancel a subscription, e.g., a specific message to remove a Webhook.
        slot_uri: td:hasCancellationSchema
        domain: EventAffordance
        range: DataSchema
        inlined: true
  VersionInfo:
    class_uri: td:VersionInfo
    description: >-
      Metadata of a Thing that provides version information about the TD document.
      If required, additional version information such as firmware and hardware version
      (term definitions outside of the TD namespace) can be extended via the TD Context Extension mechanism.
    extra_slots:
      allowed: true
    attributes:
      instance:
        description: >-
          Provides a version indicator of this TD instance.
        slot_uri: td:instance
        domain: VersionInfo
        implements:
          - owl:DatatypeProperty
        range: string
        required: true
        annotations:
          spec_description: >-
            Provides a version indicator of this TD.
      model:
        description: >-
          Provides a version indicator of the underlying TM.
        slot_uri: td:model
        domain: VersionInfo
        implements:
          - owl:DatatypeProperty
        range: string
  MultiLanguage:
    description: >-
      A Map providing a set of human-readable texts in different languages identified by language tags as defined in BCP47.
    extra_slots:
      allowed: true
    annotations:
      spec_description: >-
        A Map providing a set of human-readable texts in different languages identified by language tags as defined in [[BCP47]].
        See [6.3.2 Human-Readable Metadata](#titles-descriptions-serialization-json) for example usages of this container in a Thing Description instance.

    attributes:
      language_tag:
        identifier: true
        range: string
        required: true
        pattern: "^[a-zA-Z]{2,3}(-[a-zA-Z]{3}(-[a-zA-Z]{3}){0,2})?$"
        annotations:
          spec_exclude: true
      language_value:
        range: string
        required: true
        annotations:
          spec_exclude: true
