schema_version: 1
upstream:
  repository: w3c/wot-thing-description
  artifact: resources/upstream/html/index.html
policy: >-
  Entries are limited to complete generated TD or TM examples that differ from
  illustrative upstream inline examples.
divergences:
  - id: snippet-multiple-security-definitions1
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      example_id: multiple-security-definitions1
    rationale: The generated complete TD supplies fields omitted by the upstream example.
    expected_difference_paths:
      - actions.toggle.description
      - events.overheating.data
      - events.overheating.description
      - properties.status.type
    expected_generated:
      json_paths:
        properties.status.type: string
        actions.toggle.description: Toggle the lamp
        events.overheating.data.type: string
        events.overheating.description: Overheating event
  - id: snippet-oauth2-scopes
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      example_id: example-oauth2-scopes
    rationale: The generated complete TD supplies fields omitted by the upstream example.
    expected_difference_paths:
      - actions.configure.description
      - properties.status.type
    expected_generated:
      json_paths:
        properties.status.type: string
        actions.configure.description: Configure the device
  - id: snippet-form-serialization-sample
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      example_id: form-serialization-sample
    rationale: The generated example places the write form on its Property affordance rather than showing an unscoped top-level fragment.
    expected_difference_paths:
      - forms
      - properties
    expected_generated:
      json_paths:
        properties.temperature.forms.0.op: writeproperty
  - id: snippet-data-schema-serialization-sample
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      example_id: dataschema-serialization-sample
    rationale: The generated complete TD places the object data schema under the lampState Property affordance.
    expected_difference_paths:
      - properties.brightness
      - properties.lampState
      - properties.rgb
      - properties.status
      - type
    expected_generated:
      json_paths:
        properties.lampState.type: object
  - id: snippet-saref-geolocation-annotation-3
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      example_id: saref-geolocation-annotation-example-3
    rationale: >-
      The generated complete TD includes the Form required to expose the position Property affordance, and
      binds the schema prefix to https://schema.org/ because the upstream namespace https://schema.org# does
      not expand to schema.org terms.
    expected_difference_paths:
      - "@context"
      - properties.position.forms
    expected_generated:
      json_paths:
        "@context.1.schema": https://schema.org/
        properties.position.forms.0.href: https://robot.example.com/position
  - id: snippet-saref-geolocation-annotation-2
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      example_id: saref-geolocation-annotation-example-2
    rationale: >-
      The generated TD binds the schema prefix to https://schema.org/ because the upstream namespace
      https://schema.org# does not expand to schema.org terms.
    expected_difference_paths:
      - "@context"
    expected_generated:
      json_paths:
        "@context.1.schema": https://schema.org/
  - id: snippet-td-context-title-description
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: titles-descriptions-serialization-json
      position: 1
    rationale: >-
      The generated example gives the object-typed status Property a properties member;
      the upstream example has none.
    expected_difference_paths:
      - properties.status.properties
    expected_generated:
      json_paths:
        properties.status.properties.code.type: integer
  - id: snippet-td-context-rtl-direction
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: titles-descriptions-serialization-json
      position: 2
    rationale: >-
      The generated example gives the object-typed status Property a properties member;
      the upstream example has none.
    expected_difference_paths:
      - properties.status.properties
    expected_generated:
      json_paths:
        properties.status.properties.code.type: integer
  - id: snippet-td-context-multi-language
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: titles-descriptions-serialization-json
      position: 3
    rationale: >-
      The generated example gives the object-typed status Property a properties member;
      the upstream example has none.
    expected_difference_paths:
      - properties.status.properties
    expected_generated:
      json_paths:
        properties.status.properties.code.type: integer
  - id: snippet-td-context-default-language
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: titles-descriptions-serialization-json
      position: 4
    rationale: >-
      The generated example gives the object-typed status Property a properties member;
      the upstream example has none.
    expected_difference_paths:
      - properties.status.properties
    expected_generated:
      json_paths:
        properties.status.properties.code.type: integer
  - id: snippet-security-apikey-body
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: security-apikey
      position: 3
    rationale: >-
      The generated example names the member actions, the TD term for the map of Action Affordances; the
      upstream example names it action, which is not a TD term.
    expected_difference_paths:
      - action
      - actions
    expected_generated:
      json_paths:
        actions.on.forms.0.href: https://example.com/on
        actions.off.forms.0.href: https://example.com/off
  - id: snippet-security-apikey-body-simplified
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: security-apikey
      position: 4
    rationale: >-
      The generated example names the member actions, the TD term for the map of Action Affordances; the
      upstream example names it action, which is not a TD term.
    expected_difference_paths:
      - action
      - actions
    expected_generated:
      json_paths:
        actions.on.forms.0.href: https://example.com/on
        actions.off.forms.0.href: https://example.com/off
  - id: snippet-form-content-type
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: form-contentType
      position: 1
    rationale: >-
      The generated example shows contentType inside a Form of the status Property, where the term is
      defined; the upstream example shows it as a top-level member of an elided object.
    expected_difference_paths:
      - contentType
      - properties
    expected_generated:
      json_paths:
        properties.status.forms.0.contentType: text/plain; charset=utf-8
  - id: snippet-semantic-annotations-version-units
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: semantic-annotations-example-version-units
      position: 1
    rationale: >-
      The generated example binds the schema prefix to https://schema.org/, so compact IRIs expand to
      schema.org terms; the upstream binding https://schema.org has no trailing separator.
    expected_difference_paths:
      - "@context"
    expected_generated:
      json_paths:
        "@context.1.schema": https://schema.org/
  - id: snippet-td-model-example-tmref2
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      example_id: td-model-example-tmRef2
    rationale: >-
      The upstream example sets the title of the dimming Property to null; the generated
      example has no title member there.
    expected_difference_paths:
      - properties.dimming.title
    expected_generated:
      json_paths:
        properties.dimming:
          tm:ref: http://example.com/SmartLampControlwithDimming.tm.jsonld#/properties/dim
          maximum: 80
          unit: "%"
  - id: snippet-td-derived-from-tm
    category: complete-example
    review: approved
    upstream_locator:
      kind: example
      section_id: thing-model-td-generation-examples
      position: 2
    rationale: >-
      The generated example gives @context as a string; the upstream example gives it as an array with
      that string as its only item. Both forms are valid and equivalent; the owner keeps the string form.
    expected_difference_paths:
      - "@context"
    expected_generated:
      json_paths:
        "@context": https://www.w3.org/ns/wot-next/td
