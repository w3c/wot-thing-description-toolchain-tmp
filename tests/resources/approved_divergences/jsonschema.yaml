schema_version: 1
upstream:
  repository: w3c/wot-thing-description
  artifact: resources/upstream/schemas/td20-json-schema-validation.json
policy: >-
  Entries are TD instances on which the generated JSON Schema and the upstream JSON Schema give different
  verdicts, and the generated verdict is the reviewed one.
divergences:
  - id: jsonschema-action-attype-empty-array
    category: semantic-correction
    review: approved
    upstream_locator:
      kind: instance
      instance: 16-type-declaration/invalid/action-attype-empty-array-td-invalid.jsonld
    rationale: The upstream type_declaration array has no minItems, so it accepts [] although @type needs at least one type.
    expected_generated:
      verdict: reject
