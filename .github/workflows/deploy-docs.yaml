name: Deploy Thing Description Specification to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      DOCS_OUTPUT_PATH: resources/gens

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Install Graphviz (needed for generating diagrams)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Generate Thing Description Specification
        run: uv run wotis generate-wot-resources -d

      - name: Check index.html was generated
        # the CLI logs errors but still exits 0, so check the output here
        run: test -s resources/gens/index.html

      - name: Upload Generated Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          name: wotis-generated-docs
          path: ${{ env.DOCS_OUTPUT_PATH }}
