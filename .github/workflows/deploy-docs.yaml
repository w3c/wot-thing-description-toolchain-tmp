name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site and specification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --group docs

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Generate WoT resources and specification
        # The docs site does not depend on the generated resources; publish it even when generation fails.
        # The CI workflow is the gate for generation failures.
        continue-on-error: true
        run: uv run wot-toolchain generate-wot-resources

      - name: Build docs site
        run: uv run zensical build --strict

      - name: Add generated resources under gens/
        # Temporary: the generated artifacts will be published from the repository that owns the schemas.
        if: hashFiles('resources/gens/index.html') != ''
        run: cp -r resources/gens site/gens

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
