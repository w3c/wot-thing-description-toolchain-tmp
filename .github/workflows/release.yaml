name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    name: Attach release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # required by `gh release upload`
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Generate WoT resources and specification
        run: uv run wot-toolchain generate-wot-resources

      - name: Build Python package
        run: uv build

      - name: Bundle generated resources
        run: zip -r wot-toolchain-generated-resources.zip resources/gens

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber \
            wot-toolchain-generated-resources.zip \
            resources/gens/jsonschema/jsonschema.json \
            resources/gens/jsonldcontext/context.jsonld \
            dist/*
