name: Release

on:
  release:
    types: [created]

jobs:
  release-artifacts:
    name: Attach the TD JSON Schema to the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Generate WoT resources
        run: uv run wot-toolchain generate-wot-resources

      - name: Upload the TD JSON Schema
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -s resources/gens/jsonschema/jsonschema.json
          gh release upload "$TAG" resources/gens/jsonschema/jsonschema.json --clobber
