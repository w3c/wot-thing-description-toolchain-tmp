name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: LinkML schema lint (non-blocking)
        # the schemas still have known lint issues, so this does not fail the build yet
        run: uv run linkml-lint resources/schemas/ || true

  build:
    name: Build resources & package
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked

      - name: Install Graphviz (needed for generating diagrams)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Generate WoT resources
        run: uv run wot-toolchain generate-wot-resources

      - name: Validate snippets against the generated JSON Schema
        run: uv run python scripts/validate_snippets.py

      - name: Check generated artifacts
        # the CLI logs errors but still exits 0, so check the output files here
        run: |
          for f in \
            resources/gens/jsonschema/jsonschema.json \
            resources/gens/jsonldcontext/context.jsonld \
            resources/gens/shacl/shapes.shacl.ttl \
            resources/gens/owl/td.ttl \
            resources/gens/owl/hctl.ttl \
            resources/gens/owl/jsonschema.ttl \
            resources/gens/owl/wotsec.ttl \
            resources/gens/linkml/linkml.yaml \
            resources/gens/index.html \
            resources/gens/static/visualization/td.svg \
            resources/gens/static/visualization/jsonschema.svg \
            resources/gens/static/visualization/wotsec.svg \
            resources/gens/static/visualization/hctl.svg \
            resources/gens/static/visualization/binding-mechanism.drawio.svg \
            resources/gens/static/visualization/binding-templates.svg \
            resources/gens/static/visualization/thing_model_td.png \
            resources/gens/static/visualization/tm_overwriting.png; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          uv run python -c "import json; assert isinstance(json.load(open('resources/gens/jsonschema/jsonschema.json')), dict)"

      - name: Build Python package
        run: uv build

      - name: Upload generated resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WoT TD artifacts
          path: resources/gens/
          if-no-files-found: error

      - name: Upload Python package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: resources/gens/

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked

      - name: Download generated resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WoT TD artifacts
          path: resources/gens/

      - name: Run the tests
        run: uv run pytest

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
