name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: LinkML schema lint (non-blocking)
        # the schemas still have known lint issues, so this does not fail the build yet
        run: uv run linkml-lint resources/schemas/ || true

  build:
    name: Build resources & package
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync

      - name: Install Graphviz (needed for generating diagrams)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Generate WoT resources
        run: uv run wotis generate-wot-resources -d

      - name: Check generated artifacts
        # the CLI logs errors but still exits 0, so check the output files here
        run: |
          for f in \
            resources/gens/jsonschema/jsonschema.json \
            resources/gens/jsonldcontext/context.jsonld \
            resources/gens/shacl/shapes.shacl.ttl \
            resources/gens/owl/ontology.owl.ttl \
            resources/gens/linkml/linkml.yaml \
            resources/gens/index.html \
            resources/gens/visualization/td.svg \
            resources/gens/visualization/jsonschema.svg \
            resources/gens/visualization/wotsec.svg \
            resources/gens/visualization/hctl.svg \
            resources/gens/static/visualization/binding-mechanism.drawio.svg \
            resources/gens/static/visualization/binding-templates.svg \
            resources/gens/static/visualization/thing_model_td.png \
            resources/gens/static/visualization/tm_overwriting.png; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          uv run python -c "import json; assert isinstance(json.load(open('resources/gens/jsonschema/jsonschema.json')), dict)"

      - name: Build Python package
        run: uv build

      - name: Upload generated resources
        uses: actions/upload-artifact@v7
        with:
          name: WoT TD artifacts
          path: resources/gens/
          if-no-files-found: error

      - name: Upload Python package
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: resources/gens/

  test-gates:
    name: Test gates
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync

      - name: Download generated resources
        uses: actions/download-artifact@v8
        with:
          name: WoT TD artifacts
          path: resources/gens/

      - name: TD instance gate
        run: uv run pytest tests/test_td_instance_gate.py -v

      - name: Cross-check against W3C schemas
        run: uv run pytest tests/test_td_crosscheck.py -v

      - name: Spec HTML structure tests
        run: uv run pytest tests/test_spec_content_rendering.py tests/test_golden_form_structure.py -v

      - name: Spec HTML vs upstream golden
        run: uv run pytest tests/tmp/test_spec_html_vs_golden.py -v

      - name: Assertion inventory vs upstream
        run: uv run pytest tests/tmp/test_assertion_inventory.py -v

      - name: Default assignments
        run: uv run pytest tests/tmp/test_default_assignments.py -v

  golden-diff:
    name: Golden diff
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync

      - name: Download generated resources
        uses: actions/download-artifact@v8
        with:
          name: WoT TD artifacts
          path: resources/gens/

      - name: Golden diff
        run: uv run pytest tests/test_golden_diff.py -v

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [test-gates, golden-diff]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
