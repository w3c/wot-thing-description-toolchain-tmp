name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Mypy
        run: uv run mypy

      - name: LinkML schema lint (non-blocking)
        # Known debt: `|| true` discards the exit status, so lint findings never fail the build.
        # Remove it once the schemas lint clean.
        run: uv run linkml-lint resources/schemas/ || true

  build:
    name: Build resources and package
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Generate WoT resources
        run: uv run wot-toolchain generate-wot-resources

      - name: Build Python package
        run: uv build

      - name: Upload generated resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wot-generated-resources
          path: resources/gens/
          if-no-files-found: error

      - name: Upload Python package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROBOT_VERSION: "1.9.5"
      JSONLD_VERSION: "9.0.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked

      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Install jsonld.js
        # package.json is not tracked, so the version is pinned here.
        run: npm install --no-save "jsonld@${JSONLD_VERSION}"

      - name: Install ROBOT
        run: |
          mkdir -p "$RUNNER_TEMP/robot"
          curl -sSLf -o "$RUNNER_TEMP/robot/robot.jar" \
            "https://github.com/ontodev/robot/releases/download/v${ROBOT_VERSION}/robot.jar"
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/robot/robot.jar" > "$RUNNER_TEMP/robot/robot"
          chmod +x "$RUNNER_TEMP/robot/robot"
          echo "ROBOT_BIN=$RUNNER_TEMP/robot/robot" >> "$GITHUB_ENV"

      - name: Download generated resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wot-generated-resources
          path: resources/gens/

      - name: Run the test suite
        run: uv run pytest
